[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rootcause-agent-eval"
version = "1.0.0"
description = "Reproducible benchmark harness for token-efficient RCA: LogDx-CI + RCAEval (565 cases) + baselines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rootcause-agent contributors" }]
keywords = ["benchmark", "root-cause-analysis", "evaluation", "log-compression", "rca"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pandas>=2.0", "pyarrow>=14"]

[project.optional-dependencies]
logdx = ["logdx-ci>=0.1"]
baselines = ["causal-learn>=0.1", "scikit-learn>=1.3", "networkx>=3.0"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["eval"]

[tool.setuptools.package-data]
eval = ["*.py"]
